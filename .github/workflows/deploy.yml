name: Deploy cheat sheet and poster to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned by version and by checksum, so the rendered PDF cannot shift under a
  # new upstream release and a truncated download fails here rather than three
  # steps later. Selawik is the metric-compatible open substitute for Segoe UI;
  # see the "Install the poster's fonts" step.
  SELAWIK_URL: https://github.com/microsoft/Selawik/releases/download/1.01/Selawik_Release.zip
  SELAWIK_SHA256: 3f62c51e05e3b5a1e6241cf92a371f0be2ea1183aa87b30718bbd40832a8d423

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp and assemble every variant
        # One loop over "source|output path|language", so a new variant or a new
        # language is a line here rather than another copy of the wrapper. German
        # keeps the unprefixed paths: the poster prints its own URL, and a printed
        # URL cannot be moved later.
        run: |
          set -euo pipefail
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S")
          short_sha=$(git rev-parse --short HEAD)
          site=https://capeofgoodcode.github.io/requirements-engineering

          build () {
            source_file=$1; out_dir=$2; lang=$3; alt_lang=$4; alt_href=$5
            mkdir -p "dist/${out_dir}"
            sed -i "s#<span>Version: [^<]*</span>#<span>Version: ${timestamp} UTC (${short_sha})</span>#" "$source_file"
            {
              echo '<!doctype html>'
              echo "<html lang=\"${lang}\">"
              echo '<head>'
              echo '<meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
              echo "<link rel=\"alternate\" hreflang=\"${lang}\" href=\"${site}/${out_dir}/\">"
              echo "<link rel=\"alternate\" hreflang=\"${alt_lang}\" href=\"${site}/${alt_href}/\">"
              echo '<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>'
              echo '</head>'
              echo '<body>'
              cat "$source_file"
              echo '</body>'
              echo '</html>'
            } > "dist/${out_dir}/index.html"
            echo "built dist/${out_dir}/index.html (${lang})"
          }

          build cheatsheet-body.html     cheat-sheet     de en en/cheat-sheet
          build cheatsheet-body.en.html  en/cheat-sheet  en de cheat-sheet
          build poster-body.html         poster          de en en/poster
          build poster-body.en.html      en/poster       en de poster

      - name: Install the poster's fonts
        # The sources name Segoe UI, Palatino Linotype and Cascadia Mono. The
        # first two are proprietary and absent from the runner, so without this
        # step the PDF would be laid out in whatever fallback fontconfig picks —
        # with different metrics, which the layout check would then reject.
        # Selawik and P052 are metric-compatible open substitutes; Cascadia Mono
        # is itself open, so it is the real thing rather than a stand-in.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # Cascadia comes from apt rather than its 150 MB upstream release: the
          # only published asset carries every format, and a monospace font's
          # advance width -- the one thing this layout depends on -- is stable.
          sudo apt-get install -y --no-install-recommends \
            fonts-urw-base35 fonts-cascadia-code poppler-utils unzip
          mkdir -p "$HOME/.local/share/fonts" /tmp/fonts
          # --fail matters: without it an HTTP error page is written out as if it
          # were the archive, and the build dies at unzip with nothing to go on.
          curl -sSL --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 180 -o /tmp/fonts/selawik.zip "$SELAWIK_URL"
          echo "${SELAWIK_SHA256}  /tmp/fonts/selawik.zip" | sha256sum -c -
          unzip -qo /tmp/fonts/selawik.zip -d /tmp/fonts/selawik
          find /tmp/fonts -name '*.ttf' -exec cp {} "$HOME/.local/share/fonts/" \;
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'CONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test qual="any" name="family"><string>Segoe UI Variable Display</string></test>
              <edit name="family" mode="assign" binding="same"><string>Selawik</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>Segoe UI</string></test>
              <edit name="family" mode="assign" binding="same"><string>Selawik</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>Iowan Old Style</string></test>
              <edit name="family" mode="assign" binding="same"><string>P052</string></edit>
            </match>
            <match target="pattern">
              <test qual="any" name="family"><string>Palatino Linotype</string></test>
              <edit name="family" mode="assign" binding="same"><string>P052</string></edit>
            </match>
          </fontconfig>
          CONF
          fc-cache -f
          # Assert the substitution actually took. A silent fallback to DejaVu
          # would still render a plausible-looking PDF, in the wrong metrics, and
          # the layout check might well pass -- so check it here, loudly.
          fail=0
          check_font () {
            resolved=$(fc-match "$1" family)
            printf '  %-22s -> %s\n' "$1" "$resolved"
            case "$resolved" in
              *"$2"*) ;;
              *) echo "::error::Font '$1' resolved to '$resolved', expected '$2'."; fail=1 ;;
            esac
          }
          echo "Resolved families:"
          check_font "Segoe UI"          Selawik
          check_font "Palatino Linotype" P052
          check_font "Cascadia Mono"     Cascadia
          [ "$fail" = "0" ]

      - name: Check each poster and render its PDF
        # Every gate runs per language, because a translation re-flows the fixed
        # canvas: the English text is not merely shorter, it wraps differently and
        # can push a column past the edge.
        #
        # --headless=new is required, not cosmetic: the old headless mode ignores
        # `@page { size }` and silently emits a Letter-sized page, cropping the
        # poster while still reporting one page.
        run: |
          set -euo pipefail
          for dir in poster en/poster; do
            echo "::group::${dir}"
            python3 scripts/check-poster-layout.py "$(command -v google-chrome)" "dist/${dir}/index.html"

            google-chrome --headless=new --disable-gpu --no-sandbox \
              --no-pdf-header-footer --virtual-time-budget=8000 \
              --print-to-pdf="dist/${dir}/are-poster-a1.pdf" \
              "file://$GITHUB_WORKSPACE/dist/${dir}/index.html"

            pdf="dist/${dir}/are-poster-a1.pdf"
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            width=$(pdfinfo "$pdf" | awk '/^Page size:/ {print $3}')
            height=$(pdfinfo "$pdf" | awk '/^Page size:/ {print $5}')
            echo "PDF: ${pages} page(s), ${width} x ${height} pt"

            if [ "$pages" != "1" ]; then
              echo "::error::${dir} rendered to ${pages} pages; it must be exactly one."
              exit 1
            fi
            # A1 is 594 x 841 mm = 1683.8 x 2383.9 pt. Allow a couple of points of
            # rounding, nothing more.
            ok=$(awk -v w="$width" -v h="$height" \
                   'BEGIN { print (w > 1681 && w < 1687 && h > 2381 && h < 2387) ? "yes" : "no" }')
            if [ "$ok" != "yes" ]; then
              echo "::error::${dir} PDF page is ${width} x ${height} pt, expected A1."
              exit 1
            fi

            python3 scripts/check-poster-pdf.py "$pdf"
            echo "::endgroup::"
          done

      - name: Assemble root landing page
        run: |
          set -euo pipefail
          {
            echo '<!doctype html>'
            echo '<html lang="de">'
            echo '<head>'
            echo '<meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Advanced Requirements Engineering</title>'
            echo '<style>'
            echo ':root{color-scheme:light dark}'
            echo 'body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;'
            echo 'font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;'
            echo 'background:#e9edf1;color:#121a24}'
            echo '@media(prefers-color-scheme:dark){body{background:#0b1017;color:#e2e9f0}}'
            echo 'main{max-width:680px;width:100%}'
            echo 'h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin:0 0 8px}'
            echo 'p.lede{margin:0 0 28px;color:#55616f}'
            echo '@media(prefers-color-scheme:dark){p.lede{color:#97a4b2}}'
            echo 'h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7c8794;'
            echo 'margin:0 0 10px;font-family:ui-monospace,Consolas,monospace}'
            echo 'ul{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:12px}'
            echo 'a.card{display:block;padding:18px 20px;border-radius:8px;text-decoration:none;'
            echo 'background:#fff;border:1px solid #c9d3dc;color:inherit}'
            echo '@media(prefers-color-scheme:dark){a.card{background:#131b24;border-color:#2a3642}}'
            echo 'a.card b{display:block;font-size:18px;margin-bottom:4px}'
            echo 'a.card span{color:#55616f;font-size:15px}'
            echo '@media(prefers-color-scheme:dark){a.card span{color:#97a4b2}}'
            echo '</style>'
            echo '</head>'
            echo '<body>'
            echo '<main>'
            echo '<h1>Advanced Requirements Engineering</h1>'
            echo '<p class="lede">Vom Stakeholder Requirement bis zu den Acceptance Criteria.</p>'
            echo '<h2>Deutsch</h2>'
            echo '<ul>'
            echo '<li><a class="card" href="cheat-sheet/"><b>Cheat Sheet</b>'
            echo '<span>Alle elf Abschnitte, mit Format-Finder und ausführlichen Beispielen.</span></a></li>'
            echo '<li><a class="card" href="poster/"><b>Poster</b>'
            echo '<span>Die verdichtete Fassung auf einem Blatt &mdash; als Seite oder als A1-PDF zum Ausdrucken.</span></a></li>'
            echo '</ul>'
            echo '<h2>English</h2>'
            echo '<ul>'
            echo '<li><a class="card" href="en/cheat-sheet/" hreflang="en" lang="en"><b>Cheat Sheet</b>'
            echo '<span>All eleven sections, with the format finder and worked examples.</span></a></li>'
            echo '<li><a class="card" href="en/poster/" hreflang="en" lang="en"><b>Poster</b>'
            echo '<span>The condensed version on one sheet &mdash; as a page or as an A1 PDF for printing.</span></a></li>'
            echo '</ul>'
            echo '</main>'
            echo '</body>'
            echo '</html>'
          } > dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
